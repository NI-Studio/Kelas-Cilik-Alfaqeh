<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PdPR Cilik Al-Faqeh Kidz</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #50E3C2;
            --accent: #FF6B6B;
            --bg: #F0F4F8;
            --card: #FFFFFF;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        h1, h2, h3 {
            color: #2C3E50;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            border: 2px solid #DDD;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #357ABD;
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .subject-btn {
            background-color: var(--secondary);
            color: #1A5276;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
        }

        .activity-card {
            border-left: 5px solid var(--primary);
            padding: 15px;
            background: #F8FAFC;
            margin-bottom: 15px;
            border-radius: 0 10px 10px 0;
        }

        .record-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .record-table th, .record-table td {
            border: 1px solid #DDD;
            padding: 10px;
            text-align: center;
        }

        .record-table th {
            background-color: var(--primary);
            color: white;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎈 PdPR Cilik Al-Faqeh Kidz 🎈</h1>

    <!-- Borang Profil Murid -->
    <div id="profile-section" class="card">
        <h2>Pendaftaran Murid</h2>
        <div class="form-group">
            <label for="student-name">Nama Murid:</label>
            <input type="text" id="student-name" placeholder="Masukkan nama penuh cilik...">
        </div>
        <div class="form-group">
            <label for="student-age">Tahap Umur:</label>
            <select id="student-age">
                <option value="4">4 Tahun (Asas / Playgroup)</option>
                <option value="5">5 Tahun (Pengukuhan)</option>
                <option value="6">6 Tahun (Persediaan Darjah 1)</option>
            </select>
        </div>
        <button onclick="saveProfile()">Mula Aktiviti 🚀</button>
    </div>

    <!-- Pilihan Subjek -->
    <div id="dashboard-section" class="card hidden">
        <h2 id="welcome-msg">Selamat Datang!</h2>
        <p>Pilih subjek untuk memulakan tugasan PdPR:</p>
        <div class="grid-buttons">
            <div class="subject-btn" onclick="loadActivities('BM')">Bahasa Melayu</div>
            <div class="subject-btn" onclick="loadActivities('BI')">English</div>
            <div class="subject-btn" onclick="loadActivities('SAINS')">Sains</div>
            <div class="subject-btn" onclick="loadActivities('MATH')">Matematik</div>
            <div class="subject-btn" onclick="loadActivities('JAWI')">Jawi</div>
        </div>
        <button onclick="showRecords()" style="background-color: #9B59B6; margin-top: 20px;">📜 Lihat Rekod Aktiviti</button>
        <button onclick="resetProfile()" style="background-color: #E74C3C;">Tukar Murid / Reset</button>
    </div>

    <!-- Senarai Aktiviti Subjek -->
    <div id="activity-section" class="card hidden">
        <h2 id="subject-title">Aktiviti Subjek</h2>
        <div id="activity-list"></div>
        <button onclick="backToDashboard()" style="background-color: #7F8C8D;">⬅️ Kembali ke Menu Subjek</button>
    </div>

    <!-- Paparan Rekod -->
    <div id="record-section" class="card hidden">
        <h2>📜 Rekod Pembelajaran PdPR</h2>
        <div id="student-info-display"></div>
        <table class="record-table">
            <thead>
                <tr>
                    <th>Subjek</th>
                    <th>Aktiviti Selesai</th>
                    <th>Status Markah / Bintang</th>
                </tr>
            </thead>
            <tbody id="record-body"></tbody>
        </table>
        <button onclick="backToDashboard()" style="background-color: #7F8C8D; margin-top: 15px;">⬅️ Kembali</button>
    </div>
</div>

<script>
    let currentStudent = {};

    function saveProfile() {
        const name = document.getElementById('student-name').value.trim();
        const age = document.getElementById('student-age').value;

        if (!name) {
            alert('Sila masukkan nama murid dahulu!');
            return;
        }

        currentStudent = { name, age, progress: {} };
        localStorage.setItem('alfaqeh_student', JSON.stringify(currentStudent));
        initDashboard();
    }

    function initDashboard() {
        const saved = localStorage.getItem('alfaqeh_student');
        if (saved) {
            currentStudent = JSON.parse(saved);
            document.getElementById('profile-section').classList.add('hidden');
            document.getElementById('record-section').classList.add('hidden');
            document.getElementById('activity-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = Selamat Datang, ${currentStudent.name}! (${currentStudent.age} Tahun);
        }
    }

    function loadActivities(subject) {
        document.getElementById('dashboard-section').classList.add('hidden');
        document.getElementById('activity-section').classList.remove('hidden');
        document.getElementById('subject-title').innerText = Aktiviti ${subject} (${currentStudent.age} Tahun);

        const container = document.getElementById('activity-list');
        container.innerHTML = '';

        // Contoh paparan aktiviti berdasarkan subjek & umur
        for (let i = 1; i <= 5; i++) { // Paparan 5 aktiviti contoh daripada 40 aktiviti
            const actDiv = document.createElement('div');
            actDiv.className = 'activity-card';
            actDiv.innerHTML = `
                <h3>Tugasan ${i}: Aktiviti ${subject} Tahap ${currentStudent.age} Tahun</h3>
                <p>Sila selesaikan aktiviti membaca/menulis/melekat mengikut arahan modul.</p>
                <button onclick="markComplete('${subject}', ${i})" style="width: auto; background-color: #2ECC71;">Tanda Selesai ⭐</button>
            `;
            container.appendChild(actDiv);
        }
    }

    function markComplete(subject, actNum) {
        if (!currentStudent.progress[subject]) {
            currentStudent.progress[subject] = 0;
        }
        currentStudent.progress[subject] += 1;
        localStorage.setItem('alfaqeh_student', JSON.stringify(currentStudent));
        alert(Tahniah ${currentStudent.name}! Aktiviti ${actNum} (${subject}) telah selesai dan direkodkan ⭐);
    }

    function showRecords() {
        document.getElementById('dashboard-section').classList.add('hidden');
        document.getElementById('record-section').classList.remove('hidden');

        document.getElementById('student-info-display').innerHTML = `
            <p><strong>Nama:</strong> ${currentStudent.name}</p>
            <p><strong>Tahap Umur:</strong> ${currentStudent.age} Tahun</p>
        `;

        const tbody = document.getElementById('record-body');
        tbody.innerHTML = '';

        const subjects = ['BM', 'BI', 'SAINS', 'MATH', 'JAWI'];
        subjects.forEach(sub => {
            const count = currentStudent.progress[sub] || 0;
            const stars = '⭐'.repeat(Math.min(count, 5));
            tbody.innerHTML += `
                <tr>
                    <td>${sub}</td>
                    <td>${count} Aktiviti</td>
                    <td>${stars || 'Belum Mula'}</td>
                </tr>
            `;
        });
    }

    function backToDashboard() {
        initDashboard();
    }

    function resetProfile() {
        localStorage.removeItem('alfaqeh_student');
        location.reload();
    }

    // Semak jika data murid wujud semasa muat turun halaman
    window.onload = initDashboard;
</script>

</body>
</html>
